name: simple_live_core
version: 1.0.3
description: "聚合直播核心库"
repository: https://github.com/xiaoyaocz/dart_simple_live
publish_to: "none"
environment: 
  sdk: '>=3.10.0'

dependencies: 
  dio: ^5.5.0+1
  logger: ^2.4.0
  web_socket_channel: ^3.0.1
  html_unescape: ^2.0.0
  protobuf: ^3.1.0
  crypto: ^3.0.3
  brotli: ^0.6.0
  tars_dart:
    path: ./packages/tars_dart
  fixnum: ^1.1.0
  ffi: ^2.1.0
  # 直播源脚本运行时直接调用它的 FFI 绑定（lib/src/script/script_engine.dart），
  # 固定到测试过的提交，上游改了绑定或库名也不会影响构建
  dart_quickjs:
    git:
      url: https://github.com/xiaoyaocz/dart_quickjs
      ref: a31682801e209f925cdb90fcf4e379e512b713d2

dev_dependencies: 
  lints: ^2.0.0
  test: ^1.21.0

