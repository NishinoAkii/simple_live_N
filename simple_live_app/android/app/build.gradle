// Groovy, not Kotlin script: with AGP 9 (android.newDsl=false) the old android {} DSL,
// kotlinOptions and the v1/v2 signing flags are deprecated at error level, and a Kotlin
// script refuses to compile them; Groovy only warns. Same set-up as Kazumi's AGP 9 build.
plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("key.properties")
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

android {
    namespace = "com.xycz.simple_live"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        // flutter_local_notifications（开播提醒）要求打开 desugaring
        coreLibraryDesugaringEnabled = true
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = "11"
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "com.xycz.simple_live_N"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    signingConfigs {
        if (keystorePropertiesFile.exists()) {
            release {
                keyAlias = keystoreProperties.getProperty("keyAlias")
                keyPassword = keystoreProperties.getProperty("keyPassword")
                def store = keystoreProperties.getProperty("storeFile")
                storeFile = store ? file(store) : null
                storePassword = keystoreProperties.getProperty("storePassword")
                // CI 的正式签名是 PKCS12（keyPassword 和 storePassword 相同）；不写时按 JDK 默认类型读
                def type = keystoreProperties.getProperty("storeType")
                if (type) {
                    storeType = type
                }
                enableV1Signing = true
                enableV2Signing = true
            }
        }
    }

    buildTypes {
        release {
            // 没有正式签名时使用调试签名，打出的包可以直接安装
            signingConfig = keystorePropertiesFile.exists()
                    ? signingConfigs.release
                    : signingConfigs.debug
            minifyEnabled = true
            shrinkResources = true
            proguardFiles(
                    // Default file with automatically generated optimization rules.
                    getDefaultProguardFile("proguard-android-optimize.txt"),
                    "proguard-rules.pro"
            )
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.4"
    // 应用内更新的 FileProvider（AppUpdate.kt）。share_plus 已经带着同一个版本，这里只是让 App 自己的代码能用
    implementation "androidx.core:core:1.16.0"
}
