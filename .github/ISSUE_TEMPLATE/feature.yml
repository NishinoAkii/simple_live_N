name: "功能建议 / Feature request"
description: "新功能或改进 / A new feature or an improvement"
title: "[Feature] "
labels:
  - "enhancement"
body:
  - type: markdown
    attributes:
      value: |
        想接入新的直播平台时，可以先考虑写成直播源脚本：脚本更新不需要等 App 发布，编写方法见 [GUIDE](https://github.com/NishinoAkii/simple_live_N-sources/blob/main/GUIDE.md)。

        To support a new platform, consider writing a live source script first: scripts update without an app release. See the [guide](https://github.com/NishinoAkii/simple_live_N-sources/blob/main/GUIDE.en.md).

  - type: textarea
    id: problem
    attributes:
      label: "想解决的问题 / The problem"
      description: "现在哪里不方便，在什么场景下遇到 / What is inconvenient today, and when"
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: "建议的做法 / Proposed solution"
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: "其他方案或参考 / Alternatives or references"
      description: "其他 App 的做法、截图或链接 / How other apps do it, screenshots or links"

  - type: dropdown
    id: system
    attributes:
      label: "相关的系统 / Systems concerned"
      multiple: true
      options:
        - 全部 / All
        - Android
        - Android TV
        - iOS
        - Windows
        - macOS
        - Linux

  - type: checkboxes
    id: checks
    attributes:
      label: "确认 / Checklist"
      options:
        - label: "已搜索过已有的 Issue，没有重复 / I searched the existing issues"
          required: true
